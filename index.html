<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Kalkulator Sederhana</title>
</head>
<body>
  <h1>Kalkulator Sederhana</h1>

  <input id="angka1" type="number" placeholder="Angka pertama">
  <input id="angka2" type="number" placeholder="Angka kedua">

  <br><br>

  <button id="tambah">+</button>
  <button id="kurang">-</button>
  <button id="kali">*</button>
  <button id="bagi">/</button>
  <button id="reset">reset</button>

  <h2>Hasil: <span id="hasil">0</span></h2>

  <script src="script.js"></script>
</body>
</html>
